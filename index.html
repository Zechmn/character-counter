<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Counter App</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
</head>
<body class="dark-theme">
    <div class="container">
        <div class="app-header">
            <div class="logo">
                <img id="logo-image" src="images/logo-dark-theme.svg" alt="Character Counter Logo" class="logo-img">
            </div>
            <div class="theme-toggle">
                <button id="theme-toggle-btn" aria-label="Toggle dark/light theme">
                    <img id="theme-icon" src="images/icon-sun.svg" alt="Light mode" class="theme-icon-img">
                </button>
            </div>
        </div>
        
        <div class="hero-section">
            <h1>Analyze your text<br>in real-time.</h1>
        </div>
        
        <div class="input-container">
            <textarea 
                id="text-input" 
                placeholder="Type or paste your text here..."
                maxlength="5000"
                autofocus
            >Design is the silent ambassador of your brand. Simplicity is key to effective communication, creating clarity in every interaction. A great design transforms complex ideas into elegant solutions, making them easy to understand. It blends aesthetics and functionality seamlessly.</textarea>
        </div>
        
        <div class="controls-container">
            <div class="checkbox-controls">
                <label for="exclude-spaces-toggle">
                    <input type="checkbox" id="exclude-spaces-toggle" checked>
                    <span>Exclude Spaces</span>
                </label>
                <label for="character-limit-toggle">
                    <input type="checkbox" id="character-limit-toggle" checked>
                    <span>Set Character Limit</span>
                </label>
            </div>
            <div class="reading-time-display">
                Approx. reading time: <span id="reading-time">1 minute</span>
            </div>
        </div>
        
        <div class="stats-container">
            <div class="count-stats">
                <div class="stat-box character-box">
                    <div class="stat-pattern" style="background-image: url('images/pattern-character-count.svg')"></div>
                    <div class="stat-count" id="character-count">278</div>
                    <div class="stat-label">Total Characters</div>
                </div>
                <div class="stat-box word-box">
                    <div class="stat-pattern" style="background-image: url('images/pattern-word-count.svg')"></div>
                    <div class="stat-count" id="word-count">39</div>
                    <div class="stat-label">Word Count</div>
                </div>
                <div class="stat-box sentence-box">
                    <div class="stat-pattern" style="background-image: url('images/pattern-sentence-count.svg')"></div>
                    <div class="stat-count" id="sentence-count">04</div>
                    <div class="stat-label">Sentence Count</div>
                </div>
            </div>
            
            <div class="letter-density-section">
                <h3>Letter Density</h3>
                <div class="letter-density-visualization" id="letter-density-viz">
                    <!-- Letter bars will be added by JavaScript -->
                </div>
                <button id="see-more-btn" class="see-more-btn">See more ▾</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
